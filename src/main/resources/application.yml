server:
  port: 5000

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: interview-assistant
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  thymeleaf:
    cache: false

  # Spring AI 配置
  ai:
    openai:
      api-key: dummy-key-for-startup
      base-url: https://api.minimax.chat/v1
    embedding:
      api-key: dummy-key-for-startup
      # 向量模型提供商：bge（本地 bge-small-zh-v1.5）或 minimax（在线 API）
      provider: bge
      # BGE 本地服务配置（当 provider=bge 时使用）
      bge:
        base-url: http://localhost:11434
        model: bge-small-zh-v1.5
      # MiniMax / OpenAI 在线 API 配置（当 provider=minimax 时使用）
      minimax:
        base-url: https://api.minimaxi.com/v1
        model: embedding-2

    # Qdrant 向量数据库配置（可选，不配置则不使用 RAG）
    # 启动 Qdrant: docker run -d --name qdrant -p 6333:6333 -p 6334:6334 qdrant/qdrant
    vectorstore:
      qdrant:
        host: localhost
        port: 6334
        collection: interview_resumes
        # 可选：Qdrant 的 gRPC 端口（6334 用于 HTTP，6335 用于 gRPC）
        # grpc-port: 6335
        # 是否使用嵌入式 Qdrant（仅测试用，生产建议用 Docker）
        # use-embedded: false

# 数据存储目录
app:
  data-dir: data

# ============ Resilience4j 全局重试+超时配置 ============
resilience4j:
  # 重试配置
  retry:
    instances:
      defaultRetry:
        maxAttempts: 3
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplicator: 2.0
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.net.ConnectException
          - com.interview.assistant.service.LlmService$RetryableApiException
          - com.interview.assistant.config.QdrantConfig$RetryableApiException
        ignoreExceptions:
          - java.lang.IllegalStateException
          - java.lang.IllegalArgumentException

  # 熔断器配置
  circuitbreaker:
    instances:
      defaultCircuitBreaker:
        failureRateThreshold: 50
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        waitDurationInOpenState: 30s
        automaticTransitionFromOpenToHalfOpenEnabled: true

  # 超时配置
  timelimiter:
    instances:
      defaultTimeLimiter:
        timeoutDuration: 30s
        cancelRunningFuture: true
